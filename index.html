<canvas id="world"></canvas>

<!-- 标题页 -->
<section id="title" class="screen">
  <svg class="emblem" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#5ee6c8" stroke-width="1.5" opacity=".5"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#5ee6c8" stroke-width="3" stroke-dasharray="52 8"/>
    <g fill="#eafffa"><rect x="44" y="20" width="14" height="7" rx="3.5"/><rect x="41" y="31" width="16" height="8" rx="4"/><rect x="42" y="43" width="18" height="9" rx="4.5"/><rect x="45" y="56" width="18" height="9" rx="4.5"/><rect x="44" y="69" width="15" height="8" rx="4"/></g>
  </svg>
  <div class="kicker">Jedi Virtual Academy</div>
  <h1 class="word">绝地虚拟学院</h1>
  <p class="tag">一座悬浮于静海之上的数字学院。<br>在这里，读懂身体的结构，唤醒动作的控制，走上属于你的学徒之路。</p>
  <button class="btn" id="go">进入学院</button>
  <button class="btn ghost sm" id="cont" style="margin-top:12px" hidden>继续上次的修习</button>
  <p class="fine">JediHealth · 第一阶段交互原型 1.0<br>学院内容仅用于健康教育，不构成医疗诊断或治疗建议。</p>
</section>

<!-- 选择学徒 -->
<section id="choose" class="screen" hidden>
  <h2>选择你的学徒之路</h2>
  <p class="sub">三条道路通向同一座学院，只是起点的目光不同。</p>
  <div class="paths" id="paths"></div>
  <div class="namebox"><small>学徒法号</small><b id="nm"></b><button class="btn ghost sm" id="reroll">换一个</button></div>
  <button class="btn" id="enter">踏入学院</button>
</section>

<!-- HUD -->
<div id="hud" hidden>
  <div id="me"><div class="dot" id="meDot"></div><div><div class="nm" id="meNm"></div><div class="rk" id="meRk"></div><div class="bar"><i id="meBar"></i></div></div></div>
  <div id="tools"><button class="ico" id="bMentor" aria-label="请教导师">师</button><button class="ico" id="bMap" aria-label="学院地图">图</button></div>
  <div id="guide"></div>
  <div id="hint">点击地面行走 · 电脑可用 WASD / 方向键</div>
  <button class="btn" id="act" hidden></button>
  <div id="toast"></div>
</div>

<div id="dlg" hidden><div class="box"><div class="sage">澄</div><div style="flex:1"><div class="who">澄一导师</div><div class="txt" id="dtxt"></div><div class="more">轻触继续 ▸</div></div></div></div>

<div id="panel" hidden><div class="sheet"><header><div><div class="zh" id="pzh"></div><div class="en" id="pen"></div></div><button class="x" id="px" aria-label="关闭">×</button></header><div id="pbody"></div></div></div>
